name: Agenda verversen

# Haalt elk uur de agenda's (Socie) op en werkt agenda.json bij.
# De site gebruikt agenda.json als de agenda niet rechtstreeks geladen kan worden.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agenda-instellingen.js"
      - "agenda-ics.js"
      - "agenda-ophalen.js"
      - ".github/workflows/agenda.yml"

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  verversen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Agenda ophalen
        run: node agenda-ophalen.js
      - name: Opslaan als er iets veranderd is
        run: |
          if git diff --quiet -- agenda.json; then
            echo "Geen wijzigingen in de agenda."
            exit 0
          fi
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add agenda.json
          git commit -m "Agenda bijgewerkt"
          git push
